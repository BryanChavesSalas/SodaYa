name: Defecto
description: Algo no funciona como dice su criterio de aceptación.
labels: ["tipo: defecto"]
body:
  - type: textarea
    id: actual
    attributes:
      label: Qué pasa
      description: El comportamiento observado, con el código HTTP y el cuerpo de la respuesta si aplica.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
      description: El criterio de aceptación o el requisito de la ERS que no se cumple.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: X-Request-Id
      description: El identificador de la solicitud que falló, si lo hay.
  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options:
        - Local
        - Integración continua
        - Producción
    validations:
      required: true
