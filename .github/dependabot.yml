version: 2
updates:
  - package-ecosystem: composer
    directory: /sodaya-api
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ["*"]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
