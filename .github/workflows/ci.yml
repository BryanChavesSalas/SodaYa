name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sodaya-api
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sodaya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql
          coverage: none

      - name: Directorio de caché de Composer
        id: composer
        run: echo "cache=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer.outputs.cache }}
          key: composer-${{ runner.os }}-${{ hashFiles('sodaya-api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Auditoría de dependencias
        run: composer audit --locked --ignore-severity=low --ignore-severity=medium

      - name: Entorno
        run: cp .env.example .env && php artisan key:generate

      - name: Formato
        run: composer lint

      - name: Análisis estático
        run: composer analyse -- --no-progress

      - name: Pruebas
        run: composer test
